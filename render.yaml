services:
  - type: web
    name: webintelx-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite:///./WebIntelXAI.db
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: CORS_ALLOWED_ORIGINS
        value: https://webintelx-frontend.vercel.app,https://localhost:3000,http://localhost:3000
      - key: INGESTION_MAX_BATCH_SIZE
        value: 50
      - key: INGESTION_RATE_LIMIT_PER_MINUTE
        value: 60
      - key: ML_ENABLED
        value: true
      - key: ML_MIN_TRAINING_EVENTS
        value: 20
      - key: ML_N_ESTIMATORS
        value: 100
      - key: ML_CONTAMINATION
        value: auto
      - key: ML_RANDOM_STATE
        value: 42
      - key: ML_ANOMALY_THRESHOLD
        value: 0.70
      - key: ML_MODEL_VERSION
        value: v1
      - key: ML_FEATURE_VERSION
        value: v1
      - key: ML_MODEL_DIR
        value: data/models
      - key: CREWAI_ENABLED
        value: true
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_TEMPERATURE
        value: 0.2
      - key: LLM_MAX_TOKENS
        value: 2000
      - key: INVESTIGATION_MAX_EVENTS
        value: 100
      - key: INVESTIGATION_MAX_FINDINGS
        value: 50
      - key: INVESTIGATION_MAX_CORRELATIONS
        value: 50
